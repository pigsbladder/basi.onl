name: Update mortgage rate

# Freddie Mac publishes the 30-year average on Thursdays around noon Eastern. The script does nothing
# when there is no newer figure, so several attempts (Thursday afternoon/evening, Friday morning) are safe.
on:
  schedule:
    - cron: '30 17 * * 4'
    - cron: '0 21 * * 4'
    - cron: '0 14 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rate

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch latest rate
        run: node .github/scripts/update-rate.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain rates)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rates
            git commit -m "Update Freddie Mac 30-year rate"
            git pull --rebase
            git push
          fi
