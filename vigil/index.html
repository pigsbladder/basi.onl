<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigil — Interest Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vigil.css" />
</head>
<body>

<a href="#main-content" class="skip-link" style="position:fixed;top:-40px;left:16px;z-index:9999;background:var(--hot);color:#fff;padding:6px 14px;border-radius:0 0 6px 6px;font-size:0.8rem;font-weight:700;transition:top 0.15s;text-decoration:none;">Skip to content</a>
<style>.skip-link:focus{top:0;}</style>

<!-- ── Icon Sidebar ─────────────────────────────────────────────────────────── -->
<aside id="sidebar">

  <!-- Logo -->
  <a class="sidebar-logo" href="/" aria-label="Vigil home">
    VI<span class="logo-dot">G</span>IL
  </a>

  <!-- Spaces (close btn visible mobile only) -->
  <div class="sidebar-spaces">
    <button class="btn-drawer-close" onclick="closeDrawer()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="tabs" id="tabBar"></div>
  </div>

  <!-- Interests -->
  <div class="sidebar-interests-wrap">
    <div class="s-title" id="sidebarTitle">Interests</div>
    <div id="iList" style="display:flex;flex-direction:column;gap:3px;"></div>
  </div>

  <!-- Auth (logged-out) -->
  <div class="sidebar-auth-bottom">
    <div class="auth-btns" id="authBtns">
      <button class="btn-signup" id="btnSignup" aria-label="Sign up">Up</button>
      <button class="btn-login"  id="btnLogin"  aria-label="Log in" onclick="openAuthModal()">In</button>
    </div>
  </div>

</aside>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>

<!-- ── Header ───────────────────────────────────────────────────────────────── -->
<header>

  <!-- Left placeholder (keeps JS compat) -->
  <div class="header-left"></div>

  <div class="header-right">

    <!-- Mobile: open sidebar -->
    <button class="btn-interests" id="btnInterests" onclick="openDrawer()" aria-label="Open interests" aria-expanded="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><line x1="14" y1="8" x2="21" y2="8"/><line x1="14" y1="12" x2="21" y2="12"/><line x1="14" y1="16" x2="21" y2="16"/></svg>
      Interests
    </button>

    <!-- Category select -->
    <select id="catSel" aria-label="Category" class="search-cat-sel"></select>

    <!-- Search -->
    <div class="search-wrap" id="searchWrap">
      <svg class="search-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="cat-badge" id="catBadge" aria-hidden="true"></span>
      <input type="text" id="entInput" placeholder="Search interests…" maxlength="60" autocomplete="off" aria-label="Search interests" />
      <div id="pickerSlot" role="listbox" aria-label="Suggestions"></div>
    </div>

    <button class="btn-search" onclick="resolveEntity()" aria-label="Add interest">Add</button>

    <button class="btn-refresh" id="btnRefresh" onclick="refreshFeed()" aria-label="Refresh" title="Refresh (R)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>

    <div class="header-spacer"></div>

    <!-- User chip (post-login) -->
    <div class="auth-user" id="authUser" style="display:none">
      <div class="user-chip" id="userChip" onclick="toggleUserDropdown()" role="button" tabindex="0" aria-haspopup="true" aria-expanded="false">
        <div class="user-avatar" id="userAvatarEl"></div>
        <span class="user-name" id="userNameEl"></span>
        <span class="user-caret">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <div class="user-dropdown" id="userDropdown" style="display:none" role="menu">
        <div class="user-dropdown-email" id="userDropdownEmail"></div>
        <button class="user-dropdown-item" role="menuitem" onclick="handleLogout()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log out
        </button>
      </div>
    </div>

  </div>
</header>

<!-- ── App ──────────────────────────────────────────────────────────────────── -->
<div class="app" id="appWrap">
  <main id="main-content">

    <!-- Feed header -->
    <div class="feed-hdr">
      <div class="feed-hdr-left">
        <h1 class="feed-title-ed" id="feedTitle">Feed</h1>
        <span class="count" id="feedCount">0 new</span>
      </div>
      <div class="feed-hdr-right">
        <div class="sort-btns" id="sortBtns">
          <button class="sort-btn active" onclick="setSort('newest')">Newest</button>
          <button class="sort-btn"        onclick="setSort('oldest')">Oldest</button>
          <button class="sort-btn"        onclick="setSort('category')">Category</button>
        </div>
        <button class="btn-da" onclick="dismissAll()">Dismiss all</button>
      </div>
    </div>

    <!-- Category filter tabs -->
    <div class="cat-tabs-wrap">
      <div class="cat-tabs" id="catTabs"></div>
    </div>

    <div class="feed-list" id="feedList"></div>

  </main>
</div>

<!-- Toasts -->
<div class="toast" id="toast"></div>
<div class="kbd-hint" id="kbdHint"><kbd>j</kbd>/<kbd>k</kbd> navigate &nbsp; <kbd>o</kbd> expand &nbsp; <kbd>d</kbd> dismiss &nbsp; <kbd>v</kbd> view &nbsp; <kbd>r</kbd> refresh</div>

<div class="undo-toast" id="undoToast" role="status" aria-live="polite">
  <div class="undo-toast-row">
    <span class="undo-toast-msg">Item dismissed</span>
    <button class="undo-btn" onclick="undoDismiss()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h13a5 5 0 0 1 0 10H7"/><polyline points="3 5 3 9 7 9"/></svg>
      Undo
    </button>
  </div>
  <div class="undo-bar-track"><div class="undo-bar-fill" id="undoBarFill"></div></div>
</div>

<!-- ── Auth Modal ────────────────────────────────────────────────────────────── -->
<div class="auth-modal-overlay" id="authModalOverlay" role="dialog" aria-modal="true" aria-labelledby="authModalTitle" onclick="handleOverlayClick(event)">
  <div class="auth-modal">
    <button class="auth-modal-close" onclick="closeAuthModal()" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="auth-modal-logo">VIGIL<span class="tld">.onl</span></div>
    <h2 id="authModalTitle">Welcome back</h2>
    <p class="auth-modal-sub">Log in to sync your interests across devices.</p>
    <button class="btn-google" id="btnGoogleLogin" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider">or</div>
    <form id="authForm" onsubmit="handleEmailLogin(event)" novalidate>
      <div class="auth-field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="auth-field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-auth-submit" id="btnAuthSubmit">Log in</button>
    </form>
    <div class="auth-modal-footer">
      No account? <a href="#" onclick="handleSignupClick(event)">Sign up</a>
    </div>
  </div>
</div>

<script src="vigil-config.js"></script>
<script src="vigil.js"></script>
</body>
</html>
