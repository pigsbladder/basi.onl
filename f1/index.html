<head>
  <meta charset="UTF-8">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 17px;
      padding-bottom: 40px;
    }

    header {
      background: #1a0000;
      border-bottom: 3px solid #e10600;
      padding: 18px 20px 14px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #fff;
    }

    header h1 span { color: #e10600; }

    #countdown-bar {
      margin-top: 8px;
      font-size: 14px;
      color: #aaa;
    }

    #countdown-bar strong { color: #fff; }
    #countdown-bar .session-name { color: #e10600; font-weight: 600; }

    .races { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 12px; }

    .race-card {
      background: #1a1a1a;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }

    .race-card.next-race { border-color: #e10600; }

    .race-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 10px;
      cursor: pointer;
      user-select: none;
    }

    .race-header:active { background: #222; }

    .race-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .race-name {
      font-weight: 700;
      font-size: 18px;
      color: #fff;
    }

    .race-meta {
      font-size: 14px;
      color: #888;
    }

    .race-badges { display: flex; gap: 6px; align-items: center; }

    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .badge-sprint { background: #7b3f00; color: #ff9a3c; }
    .badge-next { background: #e10600; color: #fff; }

    .chevron {
      color: #555;
      font-size: 18px;
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-left: 8px;
    }

    .race-card.open .chevron { transform: rotate(180deg); }

    .sessions {
      display: none;
      padding: 0 14px 14px;
      border-top: 1px solid #2a2a2a;
    }

    .race-card.open .sessions { display: block; }

    .session {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid #222;
    }

    .session:last-child { border-bottom: none; }

    .session-label {
      font-size: 15px;
      color: #aaa;
      flex: 1;
    }

    .session.qualifying .session-label,
    .session.sprint-qualifying .session-label {
      color: #e10600;
      font-weight: 700;
    }

    .session.race .session-label {
      color: #fff;
      font-weight: 700;
    }

    .session.sprint .session-label {
      color: #ff9a3c;
      font-weight: 600;
    }

    .session-time {
      text-align: right;
      flex-shrink: 0;
    }

    .time-main {
      font-size: 17px;
      font-weight: 600;
      color: #fff;
    }

    .session.qualifying .time-main,
    .session.sprint-qualifying .time-main { color: #ff4d4d; }

    .time-day {
      font-size: 13px;
      color: #666;
      margin-top: 1px;
    }

    .past { opacity: 0.38; }

    .next-session-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #e10600;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .tz-note {
      text-align: center;
      font-size: 13px;
      color: #555;
      padding: 16px 20px 4px;
    }
  </style>
</head>

const TZ = "America/Anchorage";

const dayFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: TZ, weekday: "short", month: "short", day: "numeric"
});

const timeFmt = new Intl.DateTimeFormat("en-US", {
  timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true
});

function formatTime(utcStr) {
  const d = new Date(utcStr);
  return timeFmt.format(d);
}

function formatDay(utcStr) {
  const d = new Date(utcStr);
  return dayFmt.format(d);
}

function isPast(utcStr) {
  return new Date(utcStr) < new Date();
}

function raceWeekDates(race) {
  const all = race.sessions.map(s => new Date(s.utc));
  const first = all[0], last = all[all.length - 1];
  const opts = { timeZone: TZ, month: "short", day: "numeric" };
  const startFmt = new Intl.DateTimeFormat("en-US", opts);
  const endFmt = new Intl.DateTimeFormat("en-US", { ...opts, year: "numeric" });
  return `${startFmt.format(first)} – ${endFmt.format(last)}`;
}

function findNextSession() {
  const now = new Date();
  for (const race of races) {
    for (const s of race.sessions) {
      if (new Date(s.utc) > now) {
        return { race, session: s };
      }
    }
  }
  return null;
}

function pad(n) { return String(n).padStart(2, "0"); }

function formatCountdown(ms) {
  if (ms <= 0) return "now";
  const total = Math.floor(ms / 1000);
  const d = Math.floor(total / 86400);
  const h = Math.floor((total % 86400) / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  if (d > 0) return `${d}d ${pad(h)}h ${pad(m)}m`;
  if (h > 0) return `${h}h ${pad(m)}m ${pad(s)}s`;
  return `${m}m ${pad(s)}s`;
}

function renderRaces() {
  const container = document.getElementById("races");
  const now = new Date();

  // Find first race that hasn't fully finished
  let firstActiveIdx = -1;
  for (let i = 0; i < races.length; i++) {
    const lastSession = races[i].sessions[races[i].sessions.length - 1];
    if (new Date(lastSession.utc) > now) {
      firstActiveIdx = i;
      break;
    }
  }

  races.forEach((race, raceIdx) => {
    const card = document.createElement("div");
    card.className = "race-card";
    const isNext = raceIdx === firstActiveIdx;
    if (isNext) card.classList.add("next-race", "open");

    const badges = [];
    if (isNext) badges.push(`<span class="badge badge-next">Next</span>`);
    if (race.sprint) badges.push(`<span class="badge badge-sprint">Sprint</span>`);

    const sessionsHTML = race.sessions.map(s => {
      const past = isPast(s.utc);
      const isNextSession = findNextSession()?.session?.utc === s.utc;
      const dot = isNextSession ? `<span class="next-session-indicator"></span>` : "";
      return `
        <div class="session ${s.type}${past ? " past" : ""}">
          <span class="session-label">${dot}${s.label}</span>
          <div class="session-time">
            <div class="time-main">${formatTime(s.utc)}</div>
            <div class="time-day">${formatDay(s.utc)}</div>
          </div>
        </div>`;
    }).join("");

    card.innerHTML = `
      <div class="race-header">
        <div class="race-title">
          <div class="race-name">${race.name}</div>
          <div class="race-meta">${race.circuit} · ${raceWeekDates(race)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="race-badges">${badges.join("")}</div>
          <span class="chevron">⌄</span>
        </div>
      </div>
      <div class="sessions">${sessionsHTML}</div>`;

    card.querySelector(".race-header").addEventListener("click", () => {
      card.classList.toggle("open");
    });

    container.appendChild(card);
  });
}

function updateCountdown() {
  const next = findNextSession();
  const bar = document.getElementById("countdown-bar");
  if (!next) {
    bar.textContent = "Season complete";
    return;
  }
  const ms = new Date(next.session.utc) - new Date();
  bar.innerHTML = `Next: <span class="session-name">${next.session.label}</span> · <strong>${next.race.name.replace(" Grand Prix", " GP")}</strong> in <strong>${formatCountdown(ms)}</strong>`;
}

renderRaces();
updateCountdown();
setInterval(updateCountdown, 1000);
